name: PR repair evidence

on:
  pull_request:
    paths:
      - .github/workflows/pr-repair-evidence.yml

permissions:
  contents: read
  actions: read

jobs:
  evidence:
    if: github.event.pull_request.number == 67 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Collect public source and existing CI failures without executing addon code
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir evidence
          git clone --mirror https://github.com/appolon1908-hue/Odoo.git source.git
          git -C source.git bundle create "$GITHUB_WORKSPACE/evidence/odoo.bundle" --all
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.request
          from pathlib import Path

          root = 'https://api.github.com/repos/appolon1908-hue/Odoo'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}
          def api(path):
              with urllib.request.urlopen(urllib.request.Request(root + path, headers=headers), timeout=60) as response:
                  return json.load(response)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect)
          pulls = api('/pulls?state=open&per_page=100')
          manifest = [{'number': p['number'], 'head': p['head']['sha'], 'branch': p['head']['ref'], 'base': p['base']['sha']} for p in pulls]
          Path('evidence/heads.json').write_text(json.dumps(manifest, indent=2))
          for pr, run in [(67, 33969418498), (74, 33924035091), (5, 33967994669)]:
              jobs = api(f'/actions/runs/{run}/jobs?per_page=100')['jobs']
              for job in jobs:
                  if job['conclusion'] != 'failure':
                      continue
                  request = urllib.request.Request(root + f"/actions/jobs/{job['id']}/logs", headers=headers)
                  try:
                      response = opener.open(request, timeout=60)
                  except urllib.error.HTTPError as exc:
                      if exc.code != 302:
                          raise
                      # Never send the GitHub token to the signed storage URL.
                      response = urllib.request.urlopen(exc.headers['Location'], timeout=60)
                  with response:
                      text = response.read(20000000).decode('utf-8', errors='replace')
                  Path(f"evidence/pr-{pr}-job-{job['id']}.log").write_text(text)
                  lines = text.splitlines()
                  selected = set()
                  for i, line in enumerate(lines):
                      if re.search(r'(?:ERROR|FAIL): (?:Test|[A-Za-z]+Test)|error\(s\) of|ERROR=ODOO', line):
                          selected.update(range(max(0, i - 1), min(len(lines), i + 35)))
                  report = '\n'.join(lines[i] for i in sorted(selected))
                  Path(f'evidence/pr-{pr}-failures.txt').write_text(report)
                  print(f'PR={pr} RUN={run} JOB={job["id"]} FAILURE_REPORT_LINES={len(selected)}')
          PY
      - name: Upload source and CI evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: odoo-pr-repair-evidence-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 3
