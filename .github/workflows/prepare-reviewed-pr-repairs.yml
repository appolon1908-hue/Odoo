name: Prepare reviewed PR repair candidates
on:
  push:
    branches: [codex/odoo-pr-repair-preparation-20260905]
    paths: [.github/workflows/prepare-reviewed-pr-repairs.yml, .github/odoo-followup-repairs.json]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'appolon1908-hue/Odoo' && github.ref == 'refs/heads/codex/odoo-pr-repair-preparation-20260905'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact repair trees and publish isolated candidate refs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence
          python3 - <<'PY'
          import base64, json, os, pathlib, re, subprocess
          root=pathlib.Path.cwd()
          source=root/'.github/odoo-followup-repairs.json'
          repairs=json.loads(source.read_text()) if source.exists() else []
          assert isinstance(repairs,list) and len(repairs)<=5
          results=[]
          (root/'evidence/results.json').write_text('[]')
          def git(*args,cwd=root,input=None,env=None):
              return subprocess.check_output(['git',*args],cwd=cwd,input=input,text=True,env=env).strip()
          git('config','user.name','Odoo PR repair')
          git('config','user.email','275410064+appolon1908-hue@users.noreply.github.com')
          auth=dict(os.environ)
          auth.update(GIT_CONFIG_COUNT='1',GIT_CONFIG_KEY_0='http.https://github.com/.extraheader',GIT_CONFIG_VALUE_0='AUTHORIZATION: basic '+base64.b64encode(('x-access-token:'+os.environ['GH_TOKEN']).encode()).decode())
          for repair in repairs:
              number=repair['pr']; parent=repair['parent']; tree=repair['tree']; candidate=repair['candidate']
              assert number in {5,67,74,78,79}
              assert re.fullmatch(r'[0-9a-f]{40}',parent) and re.fullmatch(r'[0-9a-f]{40}',tree)
              assert re.fullmatch(f'codex/odoo-repair-pr-{number}-round[2-9]-20260905',candidate)
              work=root.parent/f'candidate-{number}'
              git('worktree','add','--detach',str(work),parent)
              git('apply','--index','-',cwd=work,input=repair['patch'])
              paths=git('diff','--cached','--name-only',cwd=work).splitlines()
              assert paths and all(p.startswith('custom-addons/') or p=='config/canonical-addon-baseline.json' for p in paths)
              assert git('write-tree',cwd=work)==tree, 'Unexpected resulting tree'
              existing=git('ls-remote','--heads','origin','refs/heads/'+candidate)
              if existing:
                  commit=existing.split()[0]
                  assert git('rev-parse',commit+'^{tree}')==tree
              else:
                  commit=git('commit-tree',tree,'-p',parent,'-m',repair['message'])
              git('checkout','--detach',commit,cwd=work)
              with (root/f'evidence/pr-{number}-source-ci.log').open('w') as log:
                  check=subprocess.run(['bash','scripts/run_ci.sh'],cwd=work,stdout=log,stderr=subprocess.STDOUT)
              row={'pr':number,'parent':parent,'tree':tree,'sha':commit,'source_ci':check.returncode,'candidate':candidate,'published':False,'paths':paths}
              if check.returncode==0:
                  git('push','origin',f'{commit}:refs/heads/{candidate}',env=auth)
                  row['published']=True
              results.append(row)
              (root/'evidence/results.json').write_text(json.dumps(results,indent=2))
              print(json.dumps(row))
          assert all(r['published'] for r in results), 'Source validation failed; PR and main branches unchanged'
          PY
      - name: Upload preparation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: odoo-repair-preparation-${{ github.run_id }}
          path: evidence/
          retention-days: 3
          if-no-files-found: error
