name: Sync Codestra Odoo addons upstream

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Branch, tag, or exact commit in Codestra-SRL/codestra-odoo-addons
        required: true
        default: main
        type: string
      operation:
        description: Plan only, or publish the exact reviewed candidate as a PR
        required: true
        default: plan
        type: choice
        options:
          - plan
          - pull-request

permissions: {}

concurrency:
  group: odoo-upstream-source-sync
  cancel-in-progress: false

jobs:
  plan:
    if: >-
      github.repository == 'appolon1908-hue/Odoo' &&
      github.ref == 'refs/heads/main'
    name: Build and validate the exact private-source candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: odoo-upstream-source-sync
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.stage.outputs.changed }}
      candidate_tree: ${{ steps.stage.outputs.candidate_tree }}
      artifact_name: ${{ steps.stage.outputs.artifact_name }}
      source_sha: ${{ steps.identity.outputs.source_sha }}
      source_tree: ${{ steps.identity.outputs.source_tree }}
      target_sha: ${{ steps.identity.outputs.target_sha }}
    env:
      SOURCE_REPOSITORY: Codestra-SRL/codestra-odoo-addons
      SOURCE_REF: ${{ inputs.upstream_ref }}
      OPERATION: ${{ inputs.operation }}
    defaults:
      run:
        working-directory: destination

    steps:
      - name: Check out the exact trusted destination main SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: destination
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact trusted workflow context
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = 'appolon1908-hue/Odoo'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          printf 'SYNC_WORKFLOW_CONTEXT=TRUSTED_MAIN\n'

      - name: Refuse private-source publication into a public destination
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          visibility="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.visibility')"
          if [[ "$visibility" != "private" ]]; then
            printf '%s\n' \
              "PRIVATE_UPSTREAM_IMPORT=BLOCKED destination_visibility=${visibility}" \
              'Make appolon1908-hue/Odoo private before importing the inaccessible Codestra-SRL source.' \
              'Do not copy organization source into a public repository.' >&2
            exit 1
          fi
          printf 'DESTINATION_VISIBILITY=private\n'

      - name: Record immutable destination validation authority
        id: validator
        run: |
          set -Eeuo pipefail
          test -f scripts/run_ci.sh
          test -f scripts/sync_codestra_odoo_addons.py
          test -f scripts/validate_upstream_git_tree.py
          test -f .gitleaks.toml
          run_ci_sha="$(sha256sum scripts/run_ci.sh | awk '{print $1}')"
          sync_sha="$(sha256sum scripts/sync_codestra_odoo_addons.py | awk '{print $1}')"
          upstream_tree_validator_sha="$(sha256sum scripts/validate_upstream_git_tree.py | awk '{print $1}')"
          gitleaks_sha="$(sha256sum .gitleaks.toml | awk '{print $1}')"
          printf 'run_ci_sha=%s\n' "$run_ci_sha" >> "$GITHUB_OUTPUT"
          printf 'sync_sha=%s\n' "$sync_sha" >> "$GITHUB_OUTPUT"
          printf 'upstream_tree_validator_sha=%s\n' "$upstream_tree_validator_sha" >> "$GITHUB_OUTPUT"
          printf 'gitleaks_sha=%s\n' "$gitleaks_sha" >> "$GITHUB_OUTPUT"
          printf 'DESTINATION_RUN_CI_SHA256=%s\n' "$run_ci_sha"
          printf 'DESTINATION_SYNC_CONTROLLER_SHA256=%s\n' "$sync_sha"
          printf 'DESTINATION_UPSTREAM_TREE_VALIDATOR_SHA256=%s\n' "$upstream_tree_validator_sha"
          printf 'DESTINATION_GITLEAKS_POLICY_SHA256=%s\n' "$gitleaks_sha"

      - name: Verify protected-environment upstream credential is bound
        env:
          UPSTREAM_TOKEN: ${{ secrets.CODESTRA_ODOO_UPSTREAM_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          if [[ -z "$UPSTREAM_TOKEN" ]]; then
            printf '%s\n' \
              'Protected environment secret CODESTRA_ODOO_UPSTREAM_READ_TOKEN is required.' \
              'Use a fine-grained token limited to Codestra-SRL/codestra-odoo-addons with Contents: read-only.' \
              'Do not store this token as an ordinary repository secret or paste it into a workflow input, issue, PR, commit, or log.' >&2
            exit 1
          fi

      - name: Check out exact inaccessible upstream source and materialize Git LFS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Codestra-SRL/codestra-odoo-addons
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.CODESTRA_ODOO_UPSTREAM_READ_TOKEN }}
          path: source
          fetch-depth: 0
          lfs: true
          submodules: false
          persist-credentials: false

      - name: Reject incomplete upstream Git trees
        run: |
          set -Eeuo pipefail
          python3 scripts/validate_upstream_git_tree.py \
            --repository ../source

      - name: Scan upstream history and materialized files with destination policy
        env:
          GITLEAKS_VERSION: v8.28.0
          DESTINATION_GITLEAKS_CONFIG: ${{ github.workspace }}/destination/.gitleaks.toml
        run: |
          set -Eeuo pipefail
          go install "github.com/zricethezav/gitleaks/v8@${GITLEAKS_VERSION}"
          (
            cd ../source
            "$(go env GOPATH)/bin/gitleaks" git \
              --config "$DESTINATION_GITLEAKS_CONFIG" \
              --redact \
              --no-banner \
              --exit-code 1
            "$(go env GOPATH)/bin/gitleaks" dir \
              --config "$DESTINATION_GITLEAKS_CONFIG" \
              --redact \
              --no-banner \
              --exit-code 1 \
              .
          )
          printf 'UPSTREAM_FULL_HISTORY_SECRET_SCAN=PASS\n'
          printf 'UPSTREAM_MATERIALIZED_FILE_SECRET_SCAN=PASS\n'

      - name: Record immutable source and destination identities
        id: identity
        run: |
          set -Eeuo pipefail
          source_sha="$(git -C ../source rev-parse HEAD)"
          source_tree="$(git -C ../source rev-parse 'HEAD^{tree}')"
          target_sha="$(git rev-parse HEAD)"
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
          printf 'source_tree=%s\n' "$source_tree" >> "$GITHUB_OUTPUT"
          printf 'target_sha=%s\n' "$target_sha" >> "$GITHUB_OUTPUT"
          printf 'UPSTREAM_SOURCE_SHA=%s\n' "$source_sha"
          printf 'UPSTREAM_SOURCE_TREE=%s\n' "$source_tree"
          printf 'DESTINATION_BASE_SHA=%s\n' "$target_sha"

      - name: Synchronize complete source and promote every addon
        run: |
          set -Eeuo pipefail
          python3 scripts/sync_codestra_odoo_addons.py \
            --upstream ../source \
            --destination . \
            --source-ref "$SOURCE_REF"
          test "$(realpath ../source)" = "${GITHUB_WORKSPACE}/source"
          rm -rf -- "${GITHUB_WORKSPACE}/source"

      - name: Validate with the preserved destination authority
        env:
          EXPECTED_RUN_CI_SHA: ${{ steps.validator.outputs.run_ci_sha }}
          EXPECTED_SYNC_SHA: ${{ steps.validator.outputs.sync_sha }}
          EXPECTED_UPSTREAM_TREE_VALIDATOR_SHA: ${{ steps.validator.outputs.upstream_tree_validator_sha }}
          EXPECTED_GITLEAKS_SHA: ${{ steps.validator.outputs.gitleaks_sha }}
          VALIDATION_PATHSPEC_FILE: ${{ runner.temp }}/validation-candidate-pathspecs.zlist
        run: |
          set -Eeuo pipefail
          test "$(sha256sum scripts/run_ci.sh | awk '{print $1}')" = "$EXPECTED_RUN_CI_SHA"
          test "$(sha256sum scripts/sync_codestra_odoo_addons.py | awk '{print $1}')" = "$EXPECTED_SYNC_SHA"
          test "$(sha256sum scripts/validate_upstream_git_tree.py | awk '{print $1}')" = "$EXPECTED_UPSTREAM_TREE_VALIDATOR_SHA"
          test "$(sha256sum .gitleaks.toml | awk '{print $1}')" = "$EXPECTED_GITLEAKS_SHA"
          git diff --check
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          state = json.loads(Path('config/upstream-sync-state.json').read_text(encoding='utf-8'))
          runtime = Path(state['runtime_addons_path'])
          paths = [Path(state['snapshot_path']), Path('config/upstream-sync-state.json')]
          paths.extend(Path(value) for value in state['managed_overlay_files'])
          paths.extend(runtime / name for name in sorted(state['modules']))
          Path(os.environ['VALIDATION_PATHSPEC_FILE']).write_bytes(
              b''.join(os.fsencode(path.as_posix()) + b'\0' for path in paths)
          )
          PY
          git add -A -- .
          git --literal-pathspecs add -f \
            --pathspec-from-file="$VALIDATION_PATHSPEC_FILE" \
            --pathspec-file-nul
          validation_tree="$(git write-tree)"
          export PYTHONPYCACHEPREFIX="${RUNNER_TEMP}/destination-python-cache"
          python3 -m compileall -q scripts custom-addons tests/security
          python3 scripts/sync_codestra_odoo_addons.py --verify-state
          ODOO_VALIDATION_TREEISH="$validation_tree" bash scripts/run_ci.sh
          printf 'VALIDATED_CANDIDATE_TREE=%s\n' "$validation_tree"
          printf 'DESTINATION_VALIDATION_AUTHORITY_UNCHANGED=YES\n'

      - name: Force-stage the complete candidate and build private plan evidence
        id: stage
        env:
          SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
          SOURCE_TREE: ${{ steps.identity.outputs.source_tree }}
          TARGET_SHA: ${{ steps.identity.outputs.target_sha }}
          PATHSPEC_FILE: ${{ runner.temp }}/upstream-sync-pathspecs.zlist
          EVIDENCE_DIR: ${{ runner.temp }}/upstream-sync-evidence
        run: |
          set -Eeuo pipefail
          rm -rf "$EVIDENCE_DIR"
          mkdir -p "$EVIDENCE_DIR"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          state_path = Path('config/upstream-sync-state.json')
          state = json.loads(state_path.read_text(encoding='utf-8'))
          runtime = Path(state['runtime_addons_path'])
          paths = [Path(state['snapshot_path']), state_path]
          paths.extend(Path(value) for value in state['managed_overlay_files'])
          paths.extend(runtime / name for name in sorted(state['modules']))

          unique: list[Path] = []
          seen: set[str] = set()
          for path in paths:
              if path.is_absolute() or '..' in path.parts or not path.parts:
                  raise SystemExit(f'unsafe candidate path: {path}')
              rendered = path.as_posix()
              if rendered == '.git' or rendered.startswith('.git/'):
                  raise SystemExit(f'Git metadata path is prohibited: {path}')
              if not (path.exists() or path.is_symlink()):
                  raise SystemExit(f'candidate path is missing: {path}')
              if rendered not in seen:
                  seen.add(rendered)
                  unique.append(path)

          payload = b''.join(os.fsencode(path.as_posix()) + b'\0' for path in unique)
          Path(os.environ['PATHSPEC_FILE']).write_bytes(payload)
          PY

          git add -A -- .
          git --literal-pathspecs add -f \
            --pathspec-from-file="$PATHSPEC_FILE" \
            --pathspec-file-nul
          git diff --cached --check

          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          state_path = Path('config/upstream-sync-state.json')
          state = json.loads(state_path.read_text(encoding='utf-8'))
          tracked = {
              os.fsdecode(value)
              for value in subprocess.check_output(
                  ['git', 'ls-files', '-z', '--cached']
              ).split(b'\0')
              if value
          }
          required: set[str] = {state_path.as_posix()}
          snapshot = Path(state['snapshot_path'])
          required.update(
              path.as_posix()
              for path in snapshot.rglob('*')
              if path.is_file() or path.is_symlink()
          )
          required.update(state['managed_overlay_files'])
          runtime = Path(state['runtime_addons_path'])
          for name in state['modules']:
              module = runtime / name
              required.update(
                  path.as_posix()
                  for path in module.rglob('*')
                  if path.is_file() or path.is_symlink()
              )
          missing = sorted(required - tracked)
          if missing:
              raise SystemExit(
                  'candidate index omitted synchronized paths:\n' + '\n'.join(missing)
              )
          for rendered in sorted(required):
              path = Path(rendered)
              payload = os.readlink(path).encode() if path.is_symlink() else path.read_bytes()
              expected = subprocess.check_output(
                  ['git', 'hash-object', '--stdin'], input=payload, text=False
              ).decode().strip()
              staged = subprocess.check_output(
                  ['git', 'rev-parse', f':{rendered}'], text=True
              ).strip()
              if staged != expected:
                  raise SystemExit(
                      f'candidate index bytes differ from validated source: {rendered}'
                  )
          print(f'CANDIDATE_TRACKED_PATHS_VERIFIED={len(required)}')
          print('CANDIDATE_STAGED_BLOBS_VERIFIED=YES')
          PY

          candidate_tree="$(git write-tree)"
          changed=true
          if git diff --cached --quiet; then
            changed=false
          fi
          artifact_name="odoo-upstream-plan-${SOURCE_SHA:0:12}-${TARGET_SHA:0:8}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          git diff --cached --binary --full-index --no-ext-diff > "$EVIDENCE_DIR/candidate.patch"
          git diff --cached --name-status > "$EVIDENCE_DIR/files.tsv"
          git diff --cached --stat > "$EVIDENCE_DIR/diff-stat.txt"
          cp config/upstream-sync-state.json "$EVIDENCE_DIR/upstream-sync-state.json"

          CANDIDATE_TREE="$candidate_tree" ARTIFACT_NAME="$artifact_name" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = Path(os.environ['EVIDENCE_DIR'])
          state = json.loads(
              Path('config/upstream-sync-state.json').read_text(encoding='utf-8')
          )
          identity = {
              'schema_version': '1.0',
              'source_repository': state['source_repository'],
              'source_ref': state['source_ref'],
              'source_sha': os.environ['SOURCE_SHA'],
              'source_tree': os.environ['SOURCE_TREE'],
              'destination_base_sha': os.environ['TARGET_SHA'],
              'candidate_tree': os.environ['CANDIDATE_TREE'],
              'artifact_name': os.environ['ARTIFACT_NAME'],
              'upstream_gitlinks': 0,
              'upstream_lfs_materialized': True,
              'runtime_activation': False,
              'deployment_authorized': False,
              'live_write_authorized': False,
          }
          (evidence / 'source-identity.json').write_text(
              json.dumps(identity, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          inventory = {
              'modules': state['modules'],
              'target_only_modules': state['target_only_modules'],
              'managed_overlay_file_count': len(state['managed_overlay_files']),
          }
          (evidence / 'module-inventory.json').write_text(
              json.dumps(inventory, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          lines = [
              '# Codestra Odoo upstream module inventory',
              '',
              f"- Source SHA: `{os.environ['SOURCE_SHA']}`",
              f"- Candidate tree: `{os.environ['CANDIDATE_TREE']}`",
              f"- Imported modules: `{len(state['modules'])}`",
              f"- Target-only modules: `{len(state['target_only_modules'])}`",
              f"- Managed overlay files: `{len(state['managed_overlay_files'])}`",
              '',
              '## Imported modules',
              '',
          ]
          lines.extend(f"- `{name}`" for name in sorted(state['modules']))
          lines.extend(['', '## Target-only modules', ''])
          lines.extend(
              f"- `{name}`" for name in sorted(state['target_only_modules'])
          )
          (evidence / 'module-inventory.md').write_text(
              '\n'.join(lines) + '\n', encoding='utf-8'
          )
          PY

          (
            cd "$EVIDENCE_DIR"
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
          )

          printf 'changed=%s\n' "$changed" >> "$GITHUB_OUTPUT"
          printf 'candidate_tree=%s\n' "$candidate_tree" >> "$GITHUB_OUTPUT"
          printf 'artifact_name=%s\n' "$artifact_name" >> "$GITHUB_OUTPUT"
          printf 'CANDIDATE_GIT_TREE=%s\n' "$candidate_tree"
          printf 'PLAN_EVIDENCE_ARTIFACT=%s\n' "$artifact_name"

          {
            printf '## Codestra Odoo upstream synchronization plan\n\n'
            printf -- '- Source repository: `%s`\n' "$SOURCE_REPOSITORY"
            printf -- '- Requested ref: `%s`\n' "$SOURCE_REF"
            printf -- '- Exact source SHA: `%s`\n' "$SOURCE_SHA"
            printf -- '- Exact source tree: `%s`\n' "$SOURCE_TREE"
            printf -- '- Destination base SHA: `%s`\n' "$TARGET_SHA"
            printf -- '- Candidate Git tree: `%s`\n' "$candidate_tree"
            printf -- '- Destination visibility: `private`\n'
            printf -- '- Protected environment: `odoo-upstream-source-sync`\n'
            printf -- '- Upstream Git submodules: `0`\n'
            printf -- '- Git LFS objects materialized: `YES`\n'
            printf -- '- Upstream history and file secret scans: `PASS`\n'
            printf -- '- Destination validation authority unchanged: `YES`\n'
            printf -- '- Ignored synchronized files force-staged and verified: `YES`\n'
            printf -- '- Changes detected: `%s`\n' "$changed"
            printf -- '- Private plan artifact: `%s`\n' "$artifact_name"
            printf -- '- Artifact retention: `3 days`\n'
            printf -- '- Runtime/deployment/live-write changes: `NONE`\n\n'
            cat "$EVIDENCE_DIR/module-inventory.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the restricted exact plan, diff, and module inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.stage.outputs.artifact_name }}
          path: ${{ runner.temp }}/upstream-sync-evidence
          if-no-files-found: error
          retention-days: 3
          compression-level: 9
          include-hidden-files: false
          overwrite: false

      - name: Stop after the read-only plan
        if: inputs.operation == 'plan'
        run: |
          set -Eeuo pipefail
          printf '%s\n' \
            'PLAN_ONLY=YES' \
            'REPOSITORY_WRITE_PERMISSION=NO' \
            'BRANCH_CREATED=NO' \
            'PULL_REQUEST_CREATED=NO' \
            'Inspect the private plan artifact before selecting pull-request mode.'

  publish:
    if: >-
      inputs.operation == 'pull-request' &&
      needs.plan.result == 'success' &&
      needs.plan.outputs.changed == 'true'
    needs: plan
    name: Publish the exact validated candidate as a protected PR
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: odoo-upstream-source-sync
    permissions:
      actions: read
      contents: write
      pull-requests: write
    env:
      SOURCE_REF: ${{ inputs.upstream_ref }}
      SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
      SOURCE_TREE: ${{ needs.plan.outputs.source_tree }}
      TARGET_SHA: ${{ needs.plan.outputs.target_sha }}
      CANDIDATE_TREE: ${{ needs.plan.outputs.candidate_tree }}
      ARTIFACT_NAME: ${{ needs.plan.outputs.artifact_name }}
      EVIDENCE_DIR: ${{ runner.temp }}/upstream-sync-evidence

    steps:
      - name: Check out the exact destination base from the accepted plan
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download the exact private plan artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.EVIDENCE_DIR }}

      - name: Verify and materialize the exact accepted candidate tree
        run: |
          set -Eeuo pipefail
          (
            cd "$EVIDENCE_DIR"
            sha256sum -c SHA256SUMS
          )
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          identity = json.loads(
              (Path(os.environ['EVIDENCE_DIR']) / 'source-identity.json').read_text(
                  encoding='utf-8'
              )
          )
          expected = {
              'source_sha': os.environ['SOURCE_SHA'],
              'source_tree': os.environ['SOURCE_TREE'],
              'destination_base_sha': os.environ['TARGET_SHA'],
              'candidate_tree': os.environ['CANDIDATE_TREE'],
              'artifact_name': os.environ['ARTIFACT_NAME'],
              'upstream_gitlinks': 0,
              'upstream_lfs_materialized': True,
          }
          for key, value in expected.items():
              if identity.get(key) != value:
                  raise SystemExit(f'plan artifact identity mismatch: {key}')
          if any(
              identity.get(flag) is not False
              for flag in (
                  'runtime_activation',
                  'deployment_authorized',
                  'live_write_authorized',
              )
          ):
              raise SystemExit('plan artifact claims a live effect')
          PY
          git apply --index --binary --whitespace=nowarn "$EVIDENCE_DIR/candidate.patch"
          git diff --cached --check
          actual_tree="$(git write-tree)"
          test "$actual_tree" = "$CANDIDATE_TREE"
          printf 'MATERIALIZED_CANDIDATE_TREE=%s\n' "$actual_tree"

      - name: Commit or reuse the immutable review branch
        id: push
        env:
          GH_TOKEN: ${{ secrets.ODOO_SYNC_PR_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          branch="sync/codestra-odoo-${SOURCE_SHA:0:12}-${TARGET_SHA:0:8}"
          git config user.name 'codestra-upstream-sync[bot]'
          git config user.email 'codestra-upstream-sync[bot]@users.noreply.github.com'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/heads/${branch}:refs/remotes/origin/${branch}"
            existing_sha="$(git rev-parse "refs/remotes/origin/${branch}")"
            existing_tree="$(git rev-parse "${existing_sha}^{tree}")"
            if [[ "$existing_tree" != "$CANDIDATE_TREE" ]]; then
              printf '%s\n' \
                'IMMUTABLE_SYNC_BRANCH=CONFLICT' \
                "branch=${branch}" \
                "existing_tree=${existing_tree}" \
                "candidate_tree=${CANDIDATE_TREE}" \
                'The same source/base identity produced different content; investigate determinism instead of force-pushing.' >&2
              exit 1
            fi
            printf 'IMMUTABLE_SYNC_BRANCH=REUSED sha=%s\n' "$existing_sha"
          else
            git checkout -b "$branch"
            git commit -m "sync: import Codestra Odoo addons at ${SOURCE_SHA}"
            test "$(git rev-parse 'HEAD^{tree}')" = "$CANDIDATE_TREE"
            git push origin "HEAD:refs/heads/${branch}"
            printf 'IMMUTABLE_SYNC_BRANCH=CREATED sha=%s\n' "$(git rev-parse HEAD)"
          fi
          printf 'branch=%s\n' "$branch" >> "$GITHUB_OUTPUT"

      - name: Open the protected upstream import pull request
        env:
          GH_TOKEN: ${{ secrets.ODOO_SYNC_PR_TOKEN }}
          BRANCH: ${{ steps.push.outputs.branch }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          body_file="$(mktemp)"
          cat > "$body_file" <<'EOF'
          ## Exact upstream import

          Import the complete source tree from `Codestra-SRL/codestra-odoo-addons` into the private `appolon1908-hue/Odoo` repository through the reviewed sync policy.
          EOF
          {
            printf '\n```text\n'
            printf 'source_ref=%s\n' "$SOURCE_REF"
            printf 'source_sha=%s\n' "$SOURCE_SHA"
            printf 'source_tree=%s\n' "$SOURCE_TREE"
            printf 'destination_base=%s\n' "$TARGET_SHA"
            printf 'candidate_tree=%s\n' "$CANDIDATE_TREE"
            printf 'plan_artifact=%s\n' "$ARTIFACT_NAME"
            printf '```\n'
          } >> "$body_file"
          cat >> "$body_file" <<'EOF'

          ### Import behavior

          - built by a repository-read-only plan job using a protected main-only source credential;
          - rejects uninitialized Git submodules and imports materialized Git LFS objects;
          - scans both upstream history and materialized files with the destination-pinned secret policy;
          - force-stages and verifies every synchronized path, including destination-ignored files;
          - materializes from the checksum-verified private plan artifact;
          - stores the complete source snapshot under `upstream/codestra-odoo-addons`;
          - promotes every discovered Odoo addon into `custom-addons/<module>`;
          - preserves destination governance and validation authorities;
          - removes only previously recorded upstream-managed paths;
          - preserves target-only addons pending separate disposition;
          - rejects ambiguous addon names, unsafe symlinks, and nondeterministic branch updates.

          ### Safety

          ```text
          DESTINATION_VISIBILITY=private
          PROTECTED_ENVIRONMENT=odoo-upstream-source-sync
          UPSTREAM_GITLINKS=0
          UPSTREAM_LFS_MATERIALIZED=YES
          UPSTREAM_SECRET_SCANS=PASS
          CANDIDATE_TREE_VERIFIED=YES
          DESTINATION_VALIDATION_AUTHORITY_UNCHANGED=YES
          ODOO_WRITE=false
          LIVE_WRITE=false
          EXTERNAL_DELIVERY=false
          RUNTIME_ACTIVATION=NO
          DATABASE_MIGRATION=NO
          DEPLOYMENT=NO
          ```

          Merge only after exact-head and merge-result CI, secret/source security, module tests, and review-thread resolution pass. This PR imports source; it does not install modules or change a running Odoo environment.
          EOF

          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json url --jq '.[0].url // empty')"
          if [[ -n "$existing" ]]; then
            printf 'EXISTING_PULL_REQUEST=%s\n' "$existing"
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$BRANCH" \
              --title "sync: import Codestra Odoo addons at ${SOURCE_SHA:0:12}" \
              --body-file "$body_file"
          fi

      - name: Record source-only publication result
        run: |
          set -Eeuo pipefail
          {
            printf '## Exact upstream candidate published for review\n\n'
            printf -- '- Source SHA: `%s`\n' "$SOURCE_SHA"
            printf -- '- Destination base SHA: `%s`\n' "$TARGET_SHA"
            printf -- '- Candidate Git tree: `%s`\n' "$CANDIDATE_TREE"
            printf -- '- Review branch: `%s`\n' '${{ steps.push.outputs.branch }}'
            printf -- '- Runtime/deployment/live-write changes: `NONE`\n'
          } >> "$GITHUB_STEP_SUMMARY"
