name: Codestra Odoo Contact Center Release Candidate

on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Exact release-branch SHA selected for candidate packaging
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cc-release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-source-candidate:
    name: Validate and package source candidate only
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out exact selected ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify workflow and source identity
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          test "${{ github.ref_name }}" = "release/cc-10-staging-certification"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$EXPECTED_SOURCE_SHA" = "${{ github.sha }}"
          printf 'CANDIDATE_SOURCE_SHA=%s\n' "$EXPECTED_SOURCE_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run exact-head source validation
        run: bash scripts/run_ci.sh

      - name: Build deterministic source candidate
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          SOURCE_TESTS_STATUS: PASS
        run: bash scripts/build_release_candidate.sh

      - name: Upload candidate evidence without publishing or deploying
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codestra-odoo-contact-center-source-${{ inputs.expected_source_sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
