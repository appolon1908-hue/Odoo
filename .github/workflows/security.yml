name: Security gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-and-source-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Python security and dependency scan
        run: |
          python -m pip install --disable-pip-version-check bandit==1.8.6 pip-audit==2.9.0
          bandit -r custom-addons -x '*/tests/*,*/migrations/*' -ll
          mapfile -t requirements < <(find . -type f -name 'requirements*.txt' -not -path './.git/*' -print)
          if ((${#requirements[@]})); then
            for requirement in "${requirements[@]}"; do pip-audit --strict -r "$requirement"; done
          else
            printf 'DEPENDENCY_LOCKFILES=NONE\n'
          fi
      - name: Repository authority scans
        run: |
          python scripts/validate_mission_security.py
          python scripts/validate_action_pins.py

  dependency-review:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: moderate
