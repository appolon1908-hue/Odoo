name: Odoo production certification

on:
  pull_request:
    paths:
      - ".github/workflows/odoo-production-certification.yml"
      - "config/production-certification.v1.json"
      - "scripts/validate_production_certification.py"
      - "evidence/production/**"
      - "tests/security/test_production_certification.py"
      - "docs/PRODUCTION-READINESS-PLAN-2026-09-02.md"
  workflow_dispatch:
    inputs:
      mode:
        description: "Validate policy or assert a completed production evidence bundle"
        required: true
        type: choice
        options:
          - policy
          - certify
        default: policy
      candidate_sha:
        description: "Exact protected-main SHA; required for certify mode"
        required: false
        type: string
      evidence_run_id:
        description: "Successful external evidence workflow run bound to candidate_sha"
        required: false
        type: string
      evidence_artifact_name:
        description: "Exact evidence artifact name from evidence_run_id"
        required: false
        type: string
        default: "odoo-production-evidence"
      evidence_file:
        description: "Relative evidence JSON path inside the downloaded artifact"
        required: false
        type: string
        default: "production-evidence.json"

permissions:
  contents: read
  actions: read

concurrency:
  group: odoo-production-certification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  policy:
    name: Validate fail-closed production policy
    if: ${{ github.event_name == 'pull_request' || inputs.mode == 'policy' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Compile production validator
        run: python3 -m py_compile scripts/validate_production_certification.py
      - name: Validate policy defaults and regressions
        run: |
          python3 scripts/validate_production_certification.py
          python3 -m unittest tests.security.test_production_certification
      - name: Prove incomplete evidence fails closed
        shell: bash
        run: |
          set -Eeuo pipefail
          if python3 scripts/validate_production_certification.py \
            --evidence evidence/production/production-evidence.template.json \
            --evidence-root evidence/production \
            --expected-source-sha 0000000000000000000000000000000000000000 \
            --assert-certified; then
            echo "Template evidence unexpectedly certified production" >&2
            exit 1
          fi
          echo "FAIL_CLOSED_TEMPLATE_TEST=PASS"

  certify:
    name: Assert exact-main production evidence
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'certify' }}
    runs-on: ubuntu-24.04
    environment: odoo-production-certification
    steps:
      - name: Require exact bounded certification inputs
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
          EVIDENCE_ARTIFACT_NAME: ${{ inputs.evidence_artifact_name }}
          EVIDENCE_FILE: ${{ inputs.evidence_file }}
        run: |
          set -Eeuo pipefail
          [[ "${GITHUB_REF}" == "refs/heads/main" ]] || {
            echo "Certification must be dispatched from main" >&2
            exit 1
          }
          [[ "${CANDIDATE_SHA}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "candidate_sha must be a lowercase 40-character Git SHA" >&2
            exit 1
          }
          [[ "${EVIDENCE_RUN_ID}" =~ ^[1-9][0-9]*$ ]] || {
            echo "evidence_run_id must be a positive integer" >&2
            exit 1
          }
          [[ "${EVIDENCE_ARTIFACT_NAME}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]] || {
            echo "evidence_artifact_name is invalid" >&2
            exit 1
          }
          [[ -n "${EVIDENCE_FILE}" && "${EVIDENCE_FILE}" != /* && "${EVIDENCE_FILE}" != *".."* && "${EVIDENCE_FILE}" != *\\* ]] || {
            echo "evidence_file must remain inside the artifact" >&2
            exit 1
          }
      - name: Check out candidate SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify candidate is current protected main
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --depth=1 origin main
          [[ "$(git rev-parse HEAD)" == "${CANDIDATE_SHA}" ]] || {
            echo "Checkout does not match candidate_sha" >&2
            exit 1
          }
          [[ "$(git rev-parse origin/main)" == "${CANDIDATE_SHA}" ]] || {
            echo "candidate_sha is not the current main head" >&2
            exit 1
          }
      - name: Authenticate the external evidence run
        id: evidence-run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${EVIDENCE_RUN_ID}")"
          status="$(jq -r '.status' <<<"${run_json}")"
          conclusion="$(jq -r '.conclusion' <<<"${run_json}")"
          head_sha="$(jq -r '.head_sha' <<<"${run_json}")"
          head_branch="$(jq -r '.head_branch' <<<"${run_json}")"
          event="$(jq -r '.event' <<<"${run_json}")"
          workflow="$(jq -r '.path' <<<"${run_json}")"
          run_attempt="$(jq -r '.run_attempt' <<<"${run_json}")"
          [[ "${status}" == "completed" && "${conclusion}" == "success" ]] || {
            echo "Evidence run is not completed successfully" >&2
            exit 1
          }
          [[ "${head_sha}" == "${CANDIDATE_SHA}" && "${head_branch}" == "main" ]] || {
            echo "Evidence run is not bound to the exact current main candidate" >&2
            exit 1
          }
          [[ "${event}" == "workflow_dispatch" ]] || {
            echo "Evidence must come from an explicit protected workflow dispatch" >&2
            exit 1
          }
          [[ "${workflow}" == .github/workflows/*.yml || "${workflow}" == .github/workflows/*.yaml ]] || {
            echo "Evidence producer workflow path is invalid" >&2
            exit 1
          }
          [[ "${workflow}" != ".github/workflows/odoo-production-certification.yml" ]] || {
            echo "Certification cannot consume evidence produced by itself" >&2
            exit 1
          }
          [[ "${run_attempt}" =~ ^[1-9][0-9]*$ ]] || {
            echo "Evidence run attempt is invalid" >&2
            exit 1
          }
          echo "workflow=${workflow}" >> "${GITHUB_OUTPUT}"
          echo "run_attempt=${run_attempt}" >> "${GITHUB_OUTPUT}"
      - name: Download the exact post-build evidence artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.evidence_run_id }}
          name: ${{ inputs.evidence_artifact_name }}
          path: ${{ runner.temp }}/odoo-production-evidence
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Run repository source gates
        run: bash scripts/run_ci.sh
      - name: Assert materialized production evidence
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
          EVIDENCE_ARTIFACT_NAME: ${{ inputs.evidence_artifact_name }}
          EVIDENCE_FILE: ${{ inputs.evidence_file }}
          EVIDENCE_WORKFLOW: ${{ steps.evidence-run.outputs.workflow }}
          EVIDENCE_RUN_ATTEMPT: ${{ steps.evidence-run.outputs.run_attempt }}
          EVIDENCE_ROOT: ${{ runner.temp }}/odoo-production-evidence
        run: |
          set -Eeuo pipefail
          [[ -f "${EVIDENCE_ROOT}/${EVIDENCE_FILE}" ]] || {
            echo "Production evidence file is missing from the artifact" >&2
            exit 1
          }
          if find "${EVIDENCE_ROOT}" -type l -print -quit | grep -q .; then
            echo "Evidence artifact contains a symbolic link" >&2
            exit 1
          fi
          python3 scripts/validate_production_certification.py \
            --evidence "${EVIDENCE_ROOT}/${EVIDENCE_FILE}" \
            --evidence-root "${EVIDENCE_ROOT}" \
            --expected-source-sha "${CANDIDATE_SHA}" \
            --expected-evidence-run-id "${EVIDENCE_RUN_ID}" \
            --expected-evidence-run-attempt "${EVIDENCE_RUN_ATTEMPT}" \
            --expected-evidence-workflow "${EVIDENCE_WORKFLOW}" \
            --expected-evidence-artifact "${EVIDENCE_ARTIFACT_NAME}" \
            --assert-certified
      - name: Record certified result
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
          EVIDENCE_ARTIFACT_NAME: ${{ inputs.evidence_artifact_name }}
          EVIDENCE_WORKFLOW: ${{ steps.evidence-run.outputs.workflow }}
        run: |
          {
            echo "## Odoo production certification"
            echo
            echo "- Source SHA: \`${CANDIDATE_SHA}\`"
            echo "- Evidence run: \`${EVIDENCE_RUN_ID}\`"
            echo "- Evidence workflow: \`${EVIDENCE_WORKFLOW}\`"
            echo "- Evidence artifact: \`${EVIDENCE_ARTIFACT_NAME}\`"
            echo "- Result: **PRODUCTION_CERTIFIED=YES**"
          } >> "${GITHUB_STEP_SUMMARY}"
