name: Odoo Addons CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: odoo-addons-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Odoo custom addons
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Reject whitespace errors
        run: git diff --check

      - name: Compile Python files
        run: python -m compileall -q custom-addons scripts

      - name: Validate Odoo manifests
        run: python scripts/validate_manifests.py

      - name: Validate Middleware and Odoo write boundary
        run: python scripts/validate_integration_boundary.py
