name: Odoo Addons CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: odoo-addons-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-head-validation:
    if: github.event_name == 'pull_request'
    name: Validate Odoo source head
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out exact source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source head identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          printf 'VALIDATED_SOURCE_SHA=%s\n' "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run Odoo source-head validation
        run: bash scripts/run_ci.sh

  merge-result-validation:
    if: github.event_name == 'pull_request'
    name: Validate Odoo merge result
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out exact merge result
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact merge-result identity
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          printf 'VALIDATED_MERGE_SHA=%s\n' "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run Odoo merge-result validation
        run: bash scripts/run_ci.sh

  runtime-validation:
    if: github.event_name == 'pull_request'
    name: Test Odoo 19 and PostgreSQL runtime
    needs:
      - source-head-validation
      - merge-result-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out exact merge result
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact runtime-test identity
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          printf 'RUNTIME_TEST_MERGE_SHA=%s\n' "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Test modules on immutable Odoo and PostgreSQL images
        shell: bash
        run: |
          set -o pipefail
          runtime_log="$RUNNER_TEMP/odoo-runtime.log"
          if ! bash scripts/run_odoo_module_tests.sh 2>&1 | tee "$runtime_log"; then
            python3 -I - "$runtime_log" <<'PY'
          from pathlib import Path
          import sys

          lines = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace").splitlines()
          starts = [i for i, line in enumerate(lines) if line == "Traceback (most recent call last):"]
          blocks = [lines[max(0, start - 4):min(len(lines), start + 28)] for start in starts[-10:]]
          if not blocks:
              blocks = [lines[-40:]]
          for number, block in enumerate(blocks, 1):
              text = "\n".join(block)[:8000]
              encoded = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Odoo runtime failure {number}::{encoded}")
          PY
            exit 1
          fi

  main-validation:
    if: github.event_name == 'push'
    name: Validate Odoo main push
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out exact pushed SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact pushed SHA identity
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          printf 'VALIDATED_PUSH_SHA=%s\n' "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run Odoo main validation
        run: bash scripts/run_ci.sh

  main-runtime-validation:
    if: github.event_name == 'push'
    name: Test merged Odoo 19 and PostgreSQL runtime
    needs:
      - main-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out exact pushed SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact runtime-test identity
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          printf 'RUNTIME_TEST_PUSH_SHA=%s\n' "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Test modules on immutable Odoo and PostgreSQL images
        shell: bash
        run: |
          set -o pipefail
          runtime_log="$RUNNER_TEMP/odoo-runtime.log"
          if ! bash scripts/run_odoo_module_tests.sh 2>&1 | tee "$runtime_log"; then
            python3 -I - "$runtime_log" <<'PY'
          from pathlib import Path
          import sys

          lines = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace").splitlines()
          starts = [i for i, line in enumerate(lines) if line == "Traceback (most recent call last):"]
          blocks = [lines[max(0, start - 4):min(len(lines), start + 28)] for start in starts[-10:]]
          if not blocks:
              blocks = [lines[-40:]]
          for number, block in enumerate(blocks, 1):
              text = "\n".join(block)[:8000]
              encoded = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Odoo runtime failure {number}::{encoded}")
          PY
            exit 1
          fi
